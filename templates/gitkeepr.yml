name: GitKeepr

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: number

permissions:
  contents: read

jobs:
  gitkeepr:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.type != 'Bot' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       github.event.comment.body == '/gitkeepr run')
    uses: MatousekJakub/gitkeepr/.github/workflows/pr-loop.yml@v0.1.1
    with:
      pr_number: ${{ github.event_name == 'issue_comment' && github.event.issue.number || inputs.pr_number }}
      trigger_kind: ${{ github.event_name == 'issue_comment' && 'comment' || 'manual' }}
      trigger_source_id: ${{ github.event_name == 'issue_comment' && format('{0}', github.event.comment.id) || '' }}
    secrets:
      app_private_key: ${{ secrets.GITKEEPR_APP_PRIVATE_KEY }}
