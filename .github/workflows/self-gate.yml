name: GitKeepr Self-Development Gate

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: number

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

jobs:
  gate:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.type != 'Bot' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       github.event.comment.body == '/gitkeepr run')
    steps:
      - name: Verify same-repository PR and dispatch candidate core
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          MANUAL_PR_NUMBER: ${{ inputs.pr_number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const event = context.eventName
            const payload = context.payload
            const prNumber = event === 'workflow_dispatch'
              ? Number(process.env.MANUAL_PR_NUMBER)
              : Number(payload.issue?.number)

            if (!Number.isSafeInteger(prNumber) || prNumber < 1) {
              core.setFailed('Could not resolve a valid pull request number')
              return
            }

            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: prNumber,
            })
            const expectedRepo = `${context.repo.owner}/${context.repo.repo}`
            if (pr.head.repo?.full_name !== expectedRepo) {
              core.notice(`Ignoring fork PR ${pr.head.repo?.full_name || '(unknown)'}; persistent runner will not execute it`)
              return
            }

            let triggerKind = 'manual'
            let triggerSourceId = ''
            if (event === 'issue_comment') {
              const comment = payload.comment
              const trustedAssociations = new Set(['OWNER', 'MEMBER', 'COLLABORATOR'])
              const trustedHuman =
                comment?.user?.type !== 'Bot' &&
                trustedAssociations.has(String(comment?.author_association || '').toUpperCase())
              if (!trustedHuman || String(comment?.body || '').trim() !== '/gitkeepr run') {
                core.notice('Ignoring non-command or untrusted issue comment')
                return
              }
              triggerKind = 'comment'
              triggerSourceId = String(comment?.id || '')
            }

            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'pr-loop.yml',
              ref: pr.head.ref,
              inputs: {
                pr_number: String(prNumber),
                trigger_kind: triggerKind,
                trigger_source_id: triggerSourceId,
              },
            })
            core.info(`Dispatched candidate pr-loop.yml from ${pr.head.ref} for PR #${prNumber}`)
