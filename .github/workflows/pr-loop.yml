name: GitKeepr PR Loop

on:
  workflow_call:
    inputs:
      pr_number: { required: true, type: number }
      trigger_kind: { required: true, type: string }
      trigger_source_id: { required: false, type: string, default: '' }
    secrets:
      app_private_key: { required: true }
  workflow_dispatch:
    inputs:
      pr_number: { required: true, type: number }
      trigger_kind: { required: true, type: string }
      trigger_source_id: { required: false, type: string, default: '' }

permissions:
  contents: read

concurrency:
  group: gitkeepr-pr-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  loop:
    runs-on: [self-hosted, linux, gitkeepr]
    timeout-minutes: 90
    env:
      GITKEEPR_BUILD_MODEL: ${{ vars.GITKEEPR_BUILD_MODEL }}
      GITKEEPR_BUILD_VARIANT: ${{ vars.GITKEEPR_BUILD_VARIANT }}
      GITKEEPR_REVIEW_MODEL: ${{ vars.GITKEEPR_REVIEW_MODEL }}
      GITKEEPR_REVIEW_VARIANT: ${{ vars.GITKEEPR_REVIEW_VARIANT }}
      GITKEEPR_MAX_CYCLES: ${{ vars.GITKEEPR_MAX_CYCLES }}
      GITKEEPR_APP_CLIENT_ID: ${{ vars.GITKEEPR_APP_CLIENT_ID }}
    steps:
      - name: Validate repository configuration
        shell: bash
        env:
          APP_PRIVATE_KEY: ${{ secrets.app_private_key }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            GITKEEPR_BUILD_MODEL \
            GITKEEPR_BUILD_VARIANT \
            GITKEEPR_REVIEW_MODEL \
            GITKEEPR_REVIEW_VARIANT \
            GITKEEPR_MAX_CYCLES \
            GITKEEPR_APP_CLIENT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing repository variable: $name"
              missing=1
            fi
          done
          if [[ -z "${APP_PRIVATE_KEY:-}" ]]; then
            echo "::error::Missing repository secret: GITKEEPR_APP_PRIVATE_KEY"
            missing=1
          fi
          if ! [[ "${GITKEEPR_MAX_CYCLES:-}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::GITKEEPR_MAX_CYCLES must be a positive integer"
            missing=1
          fi
          exit "$missing"

      - name: Add OpenCode to PATH
        shell: bash
        run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Create GitKeepr App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GITKEEPR_APP_CLIENT_ID }}
          private-key: ${{ secrets.app_private_key }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Resolve GitKeepr bot identity
        id: app-user
        uses: actions/github-script@v9
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const username = `${process.env.APP_SLUG}[bot]`
            const { data: user } = await github.rest.users.getByUsername({ username })
            core.setOutput('login', username)
            core.setOutput('name', username)
            core.setOutput('email', `${user.id}+${username}@users.noreply.github.com`)

      - name: Ensure GitKeepr status labels
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const labels = [
              { name: 'gitkeepr:building', color: '1f883d', description: 'GitKeepr Build agent is working on this PR' },
              { name: 'gitkeepr:reviewing', color: '8250df', description: 'GitKeepr Review agent is checking this PR' },
              { name: 'gitkeepr:waiting-human', color: '0969da', description: 'GitKeepr loop is complete and waiting for human input' },
              { name: 'gitkeepr:blocked', color: 'cf222e', description: 'GitKeepr loop stopped and needs human attention' },
            ]
            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name: label.name })
              } catch (error) {
                if (error.status !== 404) throw error
                await github.rest.issues.createLabel({ ...context.repo, ...label })
              }
            }

      - name: Resolve and authorize trigger
        id: context
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          TRIGGER_KIND: ${{ inputs.trigger_kind }}
          TRIGGER_SOURCE_ID: ${{ inputs.trigger_source_id }}
          BOT_LOGIN: ${{ steps.app-user.outputs.login }}
          INITIAL_REVIEW_FILE: ${{ runner.temp }}/gitkeepr-initial-review.md
          TRIGGER_FEEDBACK_FILE: ${{ runner.temp }}/gitkeepr-trigger-feedback.md
          PR_DISCUSSION_FILE: ${{ runner.temp }}/gitkeepr-pr-discussion.md
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs')
            const prNumber = Number(process.env.PR_NUMBER)
            const kind = String(process.env.TRIGGER_KIND || '')
            const sourceId = String(process.env.TRIGGER_SOURCE_ID || '')
            const trustedAssociations = new Set(['OWNER', 'MEMBER', 'COLLABORATOR'])
            const allowedKinds = new Set(['pr_opened', 'pr_sync', 'comment', 'review', 'manual'])
            const fail = message => { core.setFailed(message); return false }
            const loginOf = item => String(item?.user?.login || '')
            const isCopilot = item => {
              const login = loginOf(item).toLowerCase()
              return login === 'copilot' || login.startsWith('copilot-pull-request-reviewer')
            }
            const isTrustedHuman = item =>
              item?.user?.type !== 'Bot' && trustedAssociations.has(String(item?.author_association || '').toUpperCase())
            const formatInline = comments => comments.map(comment => {
              const line = comment.line ?? comment.original_line
              const position = comment.position ?? comment.original_position
              const side = comment.side || comment.start_side || ''
              const locator = line != null ? `line ${line}` : position != null ? `diff-position ${position}` : 'location unknown'
              const location = `${comment.path || '(unknown path)'} (${locator}${side ? `, ${side}` : ''})`
              return `- ${location}\n  ${String(comment.body || '').trim().replace(/\n/g, '\n  ')}`
            })

            if (!Number.isSafeInteger(prNumber) || prNumber < 1) return fail('Invalid PR number')
            if (!allowedKinds.has(kind)) return fail(`Unsupported trigger kind: ${kind}`)

            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: prNumber })
            const expectedRepo = `${context.repo.owner}/${context.repo.repo}`
            if (pr.head.repo?.full_name !== expectedRepo) {
              return fail(`Refusing fork PR ${pr.head.repo?.full_name || '(unknown)'}; expected ${expectedRepo}`)
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: prNumber, per_page: 100,
            })

            let triggerKey = ''
            let triggerAuthor = ''
            let triggerFeedback = ''
            let reviewState = ''
            let reviewHasFeedback = false

            if (kind === 'pr_opened') triggerKey = `pr-opened:${pr.head.sha}`
            if (kind === 'pr_sync') triggerKey = `pr-sync:${pr.head.sha}`

            if (kind === 'comment') {
              if (!/^\d+$/.test(sourceId)) return fail('Comment trigger requires a numeric trigger_source_id')
              const { data: comment } = await github.rest.issues.getComment({ ...context.repo, comment_id: Number(sourceId) })
              if (Number(comment.issue_url.split('/').pop()) !== prNumber) return fail('Trigger comment does not belong to this PR')
              if (!isTrustedHuman(comment)) return fail('Trigger comment is not from a trusted human collaborator')
              if (String(comment.body || '').includes('<!-- gitkeepr:no-build -->')) {
                return fail('gitkeepr:no-build comments are context only and cannot trigger Build')
              }
              triggerKey = `comment:${comment.id}`
              triggerAuthor = loginOf(comment)
              triggerFeedback = String(comment.body || '').trim()
            }

            if (kind === 'review') {
              if (!/^\d+$/.test(sourceId)) return fail('Review trigger requires a numeric trigger_source_id')
              const { data: review } = await github.rest.pulls.getReview({ ...context.repo, pull_number: prNumber, review_id: Number(sourceId) })
              if (!isCopilot(review) && !isTrustedHuman(review)) return fail('Trigger review is not trusted')
              if (loginOf(review) === process.env.BOT_LOGIN) return fail('GitKeepr bot reviews cannot trigger GitKeepr')
              const inline = await github.paginate(github.rest.pulls.listCommentsForReview, {
                ...context.repo, pull_number: prNumber, review_id: review.id, per_page: 100,
              })
              const body = String(review.body || '').trim()
              reviewState = String(review.state || '').toUpperCase()
              reviewHasFeedback = Boolean(body || inline.length)
              triggerKey = `review:${review.id}`
              triggerAuthor = loginOf(review)
              const parts = [
                `Submitted pull request review from @${triggerAuthor}`,
                `State: ${reviewState || '(unknown)'}`,
                `Reviewed commit: ${review.commit_id || '(unknown)'}`,
              ]
              if (body) parts.push('', 'Review body:', body)
              if (inline.length) parts.push('', 'Inline review comments:', ...formatInline(inline))
              if (!body && !inline.length) parts.push('', '(Review contains no body or inline comments.)')
              triggerFeedback = parts.join('\n')
            }

            if (kind === 'manual' && sourceId) return fail('Manual trigger must not supply trigger_source_id')

            const handledMarker = triggerKey ? `<!-- gitkeepr-trigger:v1 key=${triggerKey} -->` : ''
            const duplicate = Boolean(handledMarker && comments.some(c => String(c.body || '').includes(handledMarker)))

            core.setOutput('head_ref', pr.head.ref)
            core.setOutput('head_sha', pr.head.sha)
            core.setOutput('base_ref', pr.base.ref)
            core.setOutput('trigger_key', triggerKey)
            core.setOutput('trigger_author', triggerAuthor)
            core.setOutput('review_state', reviewState)
            core.setOutput('review_has_feedback', reviewHasFeedback ? 'true' : 'false')
            core.setOutput('duplicate', duplicate ? 'true' : 'false')
            if (duplicate) {
              core.notice(`Trigger ${triggerKey} was already handled; skipping agent work`)
              return
            }

            const systemMarkers = [
              '<!-- gitkeepr-system-review:v1',
              '<!-- gitkeepr-system-reply:v1',
              '<!-- gitkeepr-system-blocked:v1',
              '<!-- gitkeepr-trigger:v1',
            ]
            const discussionEntries = []
            for (const comment of comments) {
              if (!isTrustedHuman(comment)) continue
              const body = String(comment.body || '').trim()
              if (!body || systemMarkers.some(marker => body.includes(marker))) continue
              discussionEntries.push({
                at: comment.created_at || '',
                text: [`### PR conversation comment by @${loginOf(comment)}`, `Created: ${comment.created_at || '(unknown)'}`, '', body].join('\n'),
              })
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              ...context.repo, pull_number: prNumber, per_page: 100,
            })
            for (const review of reviews) {
              if (!isCopilot(review) && !isTrustedHuman(review)) continue
              if (loginOf(review) === process.env.BOT_LOGIN) continue
              const inline = await github.paginate(github.rest.pulls.listCommentsForReview, {
                ...context.repo, pull_number: prNumber, review_id: review.id, per_page: 100,
              })
              const body = String(review.body || '').trim()
              if (!body && !inline.length) continue
              const parts = [
                `### Pull request review by @${loginOf(review)}`,
                `State: ${String(review.state || '(unknown)').toUpperCase()}`,
                `Reviewed commit: ${review.commit_id || '(unknown)'}`,
                `Submitted: ${review.submitted_at || '(unknown)'}`,
              ]
              if (body) parts.push('', 'Review body:', body)
              if (inline.length) parts.push('', 'Inline review comments:', ...formatInline(inline))
              discussionEntries.push({ at: review.submitted_at || '', text: parts.join('\n') })
            }
            discussionEntries.sort((a, b) => String(a.at).localeCompare(String(b.at)))

            const reviewPrefix = `<!-- gitkeepr-system-review:v1 head=${pr.head.sha} verdict=`
            const latestReview = [...comments].reverse().find(c => String(c.body || '').includes(reviewPrefix))
            fs.writeFileSync(process.env.INITIAL_REVIEW_FILE, latestReview?.body || '')
            fs.writeFileSync(process.env.TRIGGER_FEEDBACK_FILE, triggerFeedback)
            fs.writeFileSync(
              process.env.PR_DISCUSSION_FILE,
              (discussionEntries.length
                ? discussionEntries.map(entry => entry.text).join('\n\n---\n\n')
                : '(No trusted human or Copilot PR discussion feedback found.)') + '\n'
            )
            core.info(`Prepared ${discussionEntries.length} trusted PR discussion entries`)

      - name: Duplicate trigger already handled
        if: steps.context.outputs.duplicate == 'true'
        shell: bash
        run: echo "Trigger ${{ steps.context.outputs.trigger_key }} was already handled; no agent work will run."

      - name: Check out exact PR head
        if: steps.context.outputs.duplicate != 'true'
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ steps.context.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify checked-out head and attach branch
        if: steps.context.outputs.duplicate != 'true'
        shell: bash
        env:
          EXPECTED_HEAD: ${{ steps.context.outputs.head_sha }}
          HEAD_REF: ${{ steps.context.outputs.head_ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git checkout -B "$HEAD_REF" "$EXPECTED_HEAD"

      - name: Bootstrap implementation notice
        if: steps.context.outputs.duplicate != 'true'
        shell: bash
        run: |
          echo "Authoritative trigger checks and trusted context preparation passed."
          echo "The Build/Review execution body is the next bootstrap iteration."
          exit 1
