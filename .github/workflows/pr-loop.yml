name: GitKeepr PR Loop

on:
  workflow_call:
    inputs:
      pr_number: { required: true, type: number }
      trigger_kind: { required: true, type: string }
      trigger_source_id: { required: false, type: string, default: '' }
    secrets:
      app_private_key: { required: true }
  workflow_dispatch:
    inputs:
      pr_number: { required: true, type: number }
      trigger_kind: { required: true, type: string }
      trigger_source_id: { required: false, type: string, default: '' }

permissions:
  contents: read

concurrency:
  group: gitkeepr-pr-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  loop:
    runs-on: [self-hosted, linux, gitkeepr]
    timeout-minutes: 360
    env:
      GITKEEPR_BUILD_MODEL: ${{ vars.GITKEEPR_BUILD_MODEL }}
      GITKEEPR_BUILD_VARIANT: ${{ vars.GITKEEPR_BUILD_VARIANT }}
      GITKEEPR_REVIEW_MODEL: ${{ vars.GITKEEPR_REVIEW_MODEL }}
      GITKEEPR_REVIEW_VARIANT: ${{ vars.GITKEEPR_REVIEW_VARIANT }}
      GITKEEPR_FINALIZATION_CYCLES: ${{ vars.GITKEEPR_FINALIZATION_CYCLES || 2 }}
      GITKEEPR_APP_CLIENT_ID: ${{ vars.GITKEEPR_APP_CLIENT_ID }}

    steps:
      - name: Validate repository configuration
        shell: bash
        env:
          APP_PRIVATE_KEY: ${{ secrets.app_private_key || secrets.GITKEEPR_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in GITKEEPR_BUILD_MODEL GITKEEPR_BUILD_VARIANT GITKEEPR_REVIEW_MODEL GITKEEPR_REVIEW_VARIANT GITKEEPR_FINALIZATION_CYCLES GITKEEPR_APP_CLIENT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing repository variable: $name"
              missing=1
            fi
          done
          if [[ -z "${APP_PRIVATE_KEY:-}" ]]; then
            echo "::error::Missing repository secret: GITKEEPR_APP_PRIVATE_KEY"
            missing=1
          fi
          if ! [[ "${GITKEEPR_FINALIZATION_CYCLES:-}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::GITKEEPR_FINALIZATION_CYCLES must be a positive integer"
            missing=1
          fi
          exit "$missing"

      - name: Add OpenCode to PATH
        shell: bash
        run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Create GitKeepr App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.GITKEEPR_APP_CLIENT_ID }}
          private-key: ${{ secrets.app_private_key || secrets.GITKEEPR_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Resolve GitKeepr bot identity
        id: app-user
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const username = `${process.env.APP_SLUG}[bot]`
            const { data: user } = await github.rest.users.getByUsername({ username })
            core.setOutput('login', username)
            core.setOutput('name', username)
            core.setOutput('email', `${user.id}+${username}@users.noreply.github.com`)

      - name: Ensure GitKeepr status labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const labels = [
              { name: 'gitkeepr:ready', color: '1f883d', description: 'Last completed GitKeepr finalization reached Review PASS' },
              { name: 'gitkeepr:needs-supervisor', color: 'bf8700', description: 'Last completed GitKeepr finalization ended with unresolved work' },
            ]
            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name: label.name })
              } catch (error) {
                if (error.status !== 404) throw error
                await github.rest.issues.createLabel({ ...context.repo, ...label })
              }
            }

      - name: Resolve and authorize trigger
        id: context
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          TRIGGER_KIND: ${{ inputs.trigger_kind }}
          TRIGGER_SOURCE_ID: ${{ inputs.trigger_source_id }}
          BOT_LOGIN: ${{ steps.app-user.outputs.login }}
          INITIAL_REVIEW_FILE: ${{ runner.temp }}/gitkeepr-initial-review.md
          PR_DISCUSSION_FILE: ${{ runner.temp }}/gitkeepr-pr-discussion.md
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs')
            const prNumber = Number(process.env.PR_NUMBER)
            const kind = String(process.env.TRIGGER_KIND || '')
            const sourceId = String(process.env.TRIGGER_SOURCE_ID || '')
            const trustedAssociations = new Set(['OWNER', 'MEMBER', 'COLLABORATOR'])
            const legacyKinds = new Set(['pr_opened', 'pr_sync', 'review'])
            const allowedKinds = new Set(['comment', 'manual', ...legacyKinds])
            const fail = message => { core.setFailed(message); return false }
            const loginOf = item => String(item?.user?.login || '')
            const isCopilot = item => {
              const login = loginOf(item).toLowerCase()
              return login === 'copilot' || login === 'copilot-pull-request-reviewer[bot]'
            }
            const isTrustedHuman = item =>
              item?.user?.type !== 'Bot' &&
              trustedAssociations.has(String(item?.author_association || '').toUpperCase())
            const formatInline = comments => comments.map(comment => {
              const line = comment.line ?? comment.original_line
              const position = comment.position ?? comment.original_position
              const side = comment.side || comment.start_side || ''
              const locator = line != null ? `line ${line}` : position != null ? `diff-position ${position}` : 'location unknown'
              const location = `${comment.path || '(unknown path)'} (${locator}${side ? `, ${side}` : ''})`
              return `- ${location}\n  ${String(comment.body || '').trim().replace(/\n/g, '\n  ')}`
            })

            if (!Number.isSafeInteger(prNumber) || prNumber < 1) return fail('Invalid PR number')
            if (!allowedKinds.has(kind)) return fail(`Unsupported trigger kind: ${kind}`)

            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: prNumber })
            const expectedRepo = `${context.repo.owner}/${context.repo.repo}`
            if (pr.head.repo?.full_name !== expectedRepo) {
              return fail(`Refusing fork PR ${pr.head.repo?.full_name || '(unknown)'}; expected ${expectedRepo}`)
            }

            core.setOutput('head_ref', pr.head.ref)
            core.setOutput('head_sha', pr.head.sha)
            core.setOutput('base_ref', pr.base.ref)
            core.setOutput('skip', 'false')

            if (legacyKinds.has(kind)) {
              core.notice(`Ignoring deprecated automatic GitKeepr trigger kind ${kind}; v0.2 runs only on /gitkeepr run or workflow_dispatch`)
              core.setOutput('skip', 'true')
              core.setOutput('duplicate', 'false')
              core.setOutput('trigger_key', '')
              return
            }

            let triggerKey = ''
            let triggerAuthor = ''
            if (kind === 'comment') {
              if (!/^\d+$/.test(sourceId)) return fail('Comment trigger requires a numeric trigger_source_id')
              const { data: comment } = await github.rest.issues.getComment({
                ...context.repo,
                comment_id: Number(sourceId),
              })
              if (Number(comment.issue_url.split('/').pop()) !== prNumber) {
                return fail('Trigger comment does not belong to this PR')
              }
              if (!isTrustedHuman(comment)) return fail('Trigger comment is not from a trusted human collaborator')
              if (String(comment.body || '').trim() !== '/gitkeepr run') {
                return fail('Only an exact /gitkeepr run comment may start GitKeepr')
              }
              triggerKey = `command:${comment.id}`
              triggerAuthor = loginOf(comment)
            }

            if (kind === 'manual') {
              if (sourceId) return fail('Manual trigger must not supply trigger_source_id')
              triggerKey = `manual:${context.runId}`
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: prNumber,
              per_page: 100,
            })
            const handledMarker = `<!-- gitkeepr-trigger:v2 key=${triggerKey} -->`
            const duplicate = comments.some(comment => String(comment.body || '').includes(handledMarker))
            core.setOutput('trigger_key', triggerKey)
            core.setOutput('trigger_author', triggerAuthor)
            core.setOutput('duplicate', duplicate ? 'true' : 'false')
            if (duplicate) {
              core.notice(`Trigger ${triggerKey} was already handled; skipping agent work`)
              return
            }

            const systemMarkers = [
              '<!-- gitkeepr-system-review:v1',
              '<!-- gitkeepr-system-reply:v1',
              '<!-- gitkeepr-system-blocked:v1',
              '<!-- gitkeepr-trigger:v1',
              '<!-- gitkeepr-trigger:v2',
            ]
            const discussionEntries = []

            for (const comment of comments) {
              if (!isTrustedHuman(comment)) continue
              const body = String(comment.body || '').trim()
              if (!body || body === '/gitkeepr run' || systemMarkers.some(marker => body.includes(marker))) continue
              discussionEntries.push({
                at: comment.created_at || '',
                text: [
                  `### PR conversation comment by @${loginOf(comment)}`,
                  `Created: ${comment.created_at || '(unknown)'}`,
                  '',
                  body,
                ].join('\n'),
              })
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              ...context.repo,
              pull_number: prNumber,
              per_page: 100,
            })
            for (const review of reviews) {
              if (!isCopilot(review) && !isTrustedHuman(review)) continue
              if (loginOf(review) === process.env.BOT_LOGIN) continue
              const inline = await github.paginate(github.rest.pulls.listCommentsForReview, {
                ...context.repo,
                pull_number: prNumber,
                review_id: review.id,
                per_page: 100,
              })
              const body = String(review.body || '').trim()
              if (!body && !inline.length) continue
              const parts = [
                `### Pull request review by @${loginOf(review)}`,
                `State: ${String(review.state || '(unknown)').toUpperCase()}`,
                `Reviewed commit: ${review.commit_id || '(unknown)'}`,
                `Submitted: ${review.submitted_at || '(unknown)'}`,
              ]
              if (body) parts.push('', 'Review body:', body)
              if (inline.length) parts.push('', 'Inline review comments:', ...formatInline(inline))
              discussionEntries.push({
                at: review.submitted_at || '',
                text: parts.join('\n'),
              })
            }
            discussionEntries.sort((a, b) => String(a.at).localeCompare(String(b.at)))

            const reviewPrefix = `<!-- gitkeepr-system-review:v1 head=${pr.head.sha} verdict=`
            const systemReplyMarker = /(?:^|\n\n)<!-- gitkeepr-system-reply:v1 source-comment=\d+ head=[0-9a-f]{40} -->(?=\n\n|$)/
            const latestReview = [...comments].reverse().find(comment => {
              const body = String(comment.body || '')
              return loginOf(comment) === process.env.BOT_LOGIN &&
                body.includes(reviewPrefix) &&
                !systemReplyMarker.test(body)
            })

            fs.writeFileSync(process.env.INITIAL_REVIEW_FILE, String(latestReview?.body || ''))
            fs.writeFileSync(
              process.env.PR_DISCUSSION_FILE,
              (discussionEntries.length
                ? discussionEntries.map(entry => entry.text).join('\n\n---\n\n')
                : '(No trusted human or Copilot PR discussion feedback found.)') + '\n'
            )

      - name: Deprecated automatic trigger ignored
        if: steps.context.outputs.skip == 'true'
        shell: bash
        run: echo "GitKeepr v0.2 requires an explicit /gitkeepr run command or workflow_dispatch."

      - name: Duplicate trigger already handled
        if: steps.context.outputs.skip != 'true' && steps.context.outputs.duplicate == 'true'
        shell: bash
        run: echo "Trigger ${{ steps.context.outputs.trigger_key }} was already handled; no agent work will run."

      - name: Check out exact PR head
        if: steps.context.outputs.skip != 'true' && steps.context.outputs.duplicate != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ steps.context.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out head and attach branch
        if: steps.context.outputs.skip != 'true' && steps.context.outputs.duplicate != 'true'
        shell: bash
        env:
          EXPECTED_HEAD: ${{ steps.context.outputs.head_sha }}
          HEAD_REF: ${{ steps.context.outputs.head_ref }}
          BASE_REF: ${{ steps.context.outputs.base_ref }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git checkout -B "$HEAD_REF" "$EXPECTED_HEAD"
          auth_header="$(printf 'x-access-token:%s' "$APP_TOKEN" | openssl base64 -A)"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.extraHeader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth_header" \
            git fetch --no-tags origin "$BASE_REF"
          git branch -f "gitkeepr-base" "FETCH_HEAD"

      - name: Run Build Review loop
        id: loop
        if: steps.context.outputs.skip != 'true' && steps.context.outputs.duplicate != 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_REF: ${{ steps.context.outputs.head_ref }}
          BASE_REF: gitkeepr-base
          PR_DISCUSSION_FILE: ${{ runner.temp }}/gitkeepr-pr-discussion.md
          INITIAL_REVIEW_FILE: ${{ runner.temp }}/gitkeepr-initial-review.md
          REVIEW_DIR: ${{ runner.temp }}/gitkeepr-loop-reviews
          APP_BOT_NAME: ${{ steps.app-user.outputs.name }}
          APP_BOT_EMAIL: ${{ steps.app-user.outputs.email }}
          APP_CLIENT_ID: ${{ vars.GITKEEPR_APP_CLIENT_ID }}
          APP_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
          APP_PRIVATE_KEY_INPUT: ${{ secrets.app_private_key || secrets.GITKEEPR_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [[ "${GITKEEPR_SANITIZED:-}" != "1" ]]; then
            exec env \
              -u APP_PRIVATE_KEY_INPUT \
              -u APP_PRIVATE_KEY_MATERIAL \
              -u APP_TOKEN \
              -u GITHUB_ENV \
              -u GITHUB_PATH \
              -u GITHUB_OUTPUT \
              -u GITHUB_STEP_SUMMARY \
              -u ACTIONS_RUNTIME_TOKEN \
              -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
              -u ACTIONS_ID_TOKEN_REQUEST_URL \
              GITKEEPR_SANITIZED=1 \
              bash "$0" "$@" \
                3<<<"$APP_PRIVATE_KEY_INPUT" \
                4<<<"$GITHUB_OUTPUT"
          fi
          APP_PRIVATE_KEY_MATERIAL="$(cat <&3)"
          GITKEEPR_OUTPUT_PATH="$(cat <&4)"
          exec 3<&-
          exec 4<&-

          AGENT_PATH="$PATH"
          OPENCODE_BIN="$(command -v opencode || true)"
          if [[ -z "$OPENCODE_BIN" || ! -x "$OPENCODE_BIN" ]]; then
            echo "::error::OpenCode executable is not available"
            exit 1
          fi
          PATH="/usr/bin:/bin"
          export PATH

          APP_TOKEN=""
          APP_TOKEN_EXPIRES_EPOCH=0

          fail() {
            echo "::error::$1"
            exit 1
          }

          supersede() {
            local expected="$1" actual="$2"
            printf 'result=superseded\n' >> "$GITKEEPR_OUTPUT_PATH"
            printf 'result_head=%s\n' "$(git rev-parse HEAD)" >> "$GITKEEPR_OUTPUT_PATH"
            echo "GitKeepr run superseded: expected PR HEAD $expected but found ${actual:-missing}."
            exit 0
          }

          base64url() {
            openssl base64 -A | tr '+/' '-_' | tr -d '='
          }

          github_app_jwt() {
            local now iat exp header payload unsigned signature
            now="$(date +%s)"
            iat=$((now - 60))
            exp=$((now + 540))
            header='{"alg":"RS256","typ":"JWT"}'
            payload="$(printf '{"iat":%s,"exp":%s,"iss":"%s"}' "$iat" "$exp" "$APP_CLIENT_ID")"
            unsigned="$(printf '%s' "$header" | base64url).$(printf '%s' "$payload" | base64url)"
            signature="$(
              printf '%s' "$unsigned" |
                openssl dgst -sha256 -sign <(printf '%s' "$APP_PRIVATE_KEY_MATERIAL") |
                base64url
            )"
            printf '%s.%s' "$unsigned" "$signature"
          }

          refresh_app_token() {
            local jwt response repo_name token expires_at
            jwt="$(github_app_jwt)" || return 1
            repo_name="${GITHUB_REPOSITORY#*/}"
            response="$(
              curl -q -fsS -X POST \
                -H 'Accept: application/vnd.github+json' \
                -H "Authorization: Bearer $jwt" \
                -H 'X-GitHub-Api-Version: 2026-03-10' \
                -H 'Content-Type: application/json' \
                "$GITHUB_API_URL/app/installations/$APP_INSTALLATION_ID/access_tokens" \
                -d "$(printf '{"repositories":["%s"],"permissions":{"contents":"write","issues":"write","pull_requests":"write","workflows":"write"}}' "$repo_name")"
            )" || return 1
            token="$(printf '%s' "$response" | jq -r '.token // empty')"
            expires_at="$(printf '%s' "$response" | jq -r '.expires_at // empty')"
            [[ -n "$token" && -n "$expires_at" ]] || return 1
            APP_TOKEN="$token"
            APP_TOKEN_EXPIRES_EPOCH="$(date -d "$expires_at" +%s)" || return 1
            echo "::add-mask::$APP_TOKEN" >&2
            echo "GitKeepr refreshed GitHub App credentials (expires $expires_at)." >&2
          }

          ensure_app_token() {
            local now
            now="$(date +%s)"
            if [[ -z "$APP_TOKEN" || "$APP_TOKEN_EXPIRES_EPOCH" -le $((now + 300)) ]]; then
              refresh_app_token
            fi
          }

          git_remote_head_once() {
            local auth_header remote_url protocol
            ensure_app_token || return 1
            remote_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
            protocol="${GITHUB_SERVER_URL%%:*}"
            [[ "$protocol" == "https" || "$protocol" == "http" ]] || return 1
            auth_header="$(printf 'x-access-token:%s' "$APP_TOKEN" | openssl base64 -A)"
            GIT_CONFIG_GLOBAL=/dev/null \
            GIT_CONFIG_SYSTEM=/dev/null \
            GIT_ALLOW_PROTOCOL="$protocol" \
            GIT_TERMINAL_PROMPT=0 \
            GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${remote_url}.extraHeader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth_header" \
              git -c core.hooksPath=/dev/null ls-remote "$remote_url" "refs/heads/${HEAD_REF}" |
                awk 'NR == 1 { print $1 }'
          }

          remote_head_with_app_token() {
            local head
            if head="$(git_remote_head_once)"; then
              printf '%s\n' "$head"
              return 0
            fi
            APP_TOKEN=""
            APP_TOKEN_EXPIRES_EPOCH=0
            refresh_app_token || return 1
            git_remote_head_once
          }

          ensure_remote_head() {
            local expected="$1" actual
            actual="$(remote_head_with_app_token)" || fail "Could not read current PR branch HEAD."
            [[ "$actual" == "$expected" ]] || supersede "$expected" "$actual"
          }

          git_push_once() {
            local auth_header remote_url protocol
            ensure_app_token || return 1
            remote_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
            protocol="${GITHUB_SERVER_URL%%:*}"
            [[ "$protocol" == "https" || "$protocol" == "http" ]] || return 1
            auth_header="$(printf 'x-access-token:%s' "$APP_TOKEN" | openssl base64 -A)"
            GIT_CONFIG_GLOBAL=/dev/null \
            GIT_CONFIG_SYSTEM=/dev/null \
            GIT_ALLOW_PROTOCOL="$protocol" \
            GIT_TERMINAL_PROMPT=0 \
            GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${remote_url}.extraHeader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth_header" \
              git -c core.hooksPath=/dev/null push "$remote_url" "HEAD:refs/heads/${HEAD_REF}"
          }

          push_head_with_app_token() {
            local expected="$1" actual
            ensure_remote_head "$expected"
            if git_push_once; then
              return 0
            fi
            actual="$(remote_head_with_app_token || true)"
            if [[ -n "$actual" && "$actual" != "$expected" ]]; then
              supersede "$expected" "$actual"
            fi
            echo "::warning::Git push failed; refreshing GitHub App credentials and retrying once."
            APP_TOKEN=""
            APP_TOKEN_EXPIRES_EPOCH=0
            refresh_app_token || return 1
            ensure_remote_head "$expected"
            git_push_once
          }

          git config user.name "$APP_BOT_NAME"
          git config user.email "$APP_BOT_EMAIL"
          GIT_CONFIG_PATH="$(git rev-parse --git-path config)"
          TRUSTED_GIT_CONFIG_SHA="$(sha256sum "$GIT_CONFIG_PATH" | awk '{print $1}')"

          assert_agent_git_boundary() {
            local expected_head="$1" agent_name="$2" actual_head actual_branch config_sha
            actual_head="$(git rev-parse HEAD)"
            actual_branch="$(git symbolic-ref --quiet --short HEAD || true)"
            [[ -f "$GIT_CONFIG_PATH" ]] || fail "$agent_name agent removed repository Git config."
            config_sha="$(sha256sum "$GIT_CONFIG_PATH" | awk '{print $1}')"
            [[ "$actual_head" == "$expected_head" ]] ||
              fail "$agent_name agent changed Git HEAD from $expected_head to $actual_head; Git operations are workflow-owned."
            [[ "$actual_branch" == "$HEAD_REF" ]] ||
              fail "$agent_name agent changed the checked-out branch from $HEAD_REF to ${actual_branch:-detached}; Git operations are workflow-owned."
            [[ "$config_sha" == "$TRUSTED_GIT_CONFIG_SHA" ]] ||
              fail "$agent_name agent modified repository Git config; refusing credentialed Git operations with agent-controlled config."
          }

          rm -rf "$REVIEW_DIR"
          mkdir -p "$REVIEW_DIR"
          review_context="$INITIAL_REVIEW_FILE"
          pr_discussion="$(cat "$PR_DISCUSSION_FILE" 2>/dev/null || true)"
          final_head="$(git rev-parse HEAD)"

          for cycle in $(seq 1 "$GITKEEPR_FINALIZATION_CYCLES"); do
            echo "=== GitKeepr bounded finalization cycle $cycle/$GITKEEPR_FINALIZATION_CYCLES ==="
            start_head="$(git rev-parse HEAD)"
            previous_review="$(cat "$review_context" 2>/dev/null || true)"

            build_prompt="$(cat <<EOF
          You are the Build agent for pull request #${PR_NUMBER}. Work directly in the checked-out repository.

          This is a bounded finalization run. The primary implementation has normally already been prepared outside GitKeepr. Read .ai/plan.md if present, the current code and tests, trusted PR discussion, and prior GitKeepr review below. Verify stale findings against the current HEAD.

          Resolve all safely actionable remaining work you can identify in this Build turn. Do not artificially limit yourself to one planned task. If a required product decision is genuinely missing, do not invent it.

          Context7 and Chrome DevTools MCP tools are available on the runner. Use them when useful; they are optional tools, not required workflow steps.

          Run the relevant tests for the repository and task. Do not commit, push, create branches, or modify GitHub metadata; the workflow owns Git and GitHub operations.

          Trusted PR discussion:
          ${pr_discussion}

          Prior GitKeepr review:
          ${previous_review}

          Finish with a concise human-readable summary of what you changed and what you tested.
          EOF
            )"

            build_events="$RUNNER_TEMP/gitkeepr-build-${cycle}.jsonl"
            if ! env -u APP_PRIVATE_KEY_INPUT -u APP_PRIVATE_KEY_MATERIAL -u APP_TOKEN PATH="$AGENT_PATH" "$OPENCODE_BIN" run \
              --auto \
              --agent build \
              --model "$GITKEEPR_BUILD_MODEL" \
              --variant "$GITKEEPR_BUILD_VARIANT" \
              --format json \
              "$build_prompt" > "$build_events"; then
              fail "Build agent failed during cycle $cycle."
            fi
            assert_agent_git_boundary "$start_head" "Build"

            changed=false
            if ! git diff --quiet || ! git diff --cached --quiet || [[ -n "$(git ls-files --others --exclude-standard)" ]]; then
              changed=true
            fi

            if [[ "$changed" == "true" ]]; then
              ensure_remote_head "$start_head"
              git add -A
              git -c core.hooksPath=/dev/null commit -m "gitkeepr: build cycle ${cycle}"
              if ! push_head_with_app_token "$start_head"; then
                fail "Git push failed after Build cycle $cycle, including one retry with refreshed GitHub App credentials."
              fi
            else
              echo "Build made no repository changes. Review will evaluate the current HEAD."
            fi

            current_head="$(git rev-parse HEAD)"
            final_head="$current_head"
            ensure_remote_head "$current_head"

            review_events="$RUNNER_TEMP/gitkeepr-review-${cycle}.jsonl"
            review_file="$REVIEW_DIR/$(printf '%02d' "$cycle").md"
            review_prompt="$(cat <<EOF
          You are the independent Review agent for pull request #${PR_NUMBER}. Review the checked-out PR at HEAD ${current_head} against the base branch. Read .ai/plan.md if present, inspect git diff ${BASE_REF}...HEAD, inspect relevant code and tests, and consider the trusted PR discussion below. Do not edit repository files.

          Verify every old finding against the current HEAD. Already-resolved feedback must not block PASS. Unresolved still-relevant correctness, testing, or scope problems must block PASS.

          Context7 and Chrome DevTools MCP tools are available on the runner. Use them when useful; they are optional tools, not required workflow steps.

          Trusted PR discussion:
          ${pr_discussion}

          Return CONTINUE if any blocking correctness/test issue remains or any logical task in the current PR scope remains unfinished. Return PASS only when the entire current PR scope is complete, the implementation is correct, relevant tests are adequate, and no still-relevant blocking feedback remains.

          Your final response must be concise human-readable Markdown. Its final line must be exactly one of:
          <!-- gitkeepr-system-review:v1 head=${current_head} verdict=continue -->
          <!-- gitkeepr-system-review:v1 head=${current_head} verdict=pass -->
          Put nothing after the marker.
          EOF
            )"

            if ! env -u APP_PRIVATE_KEY_INPUT -u APP_PRIVATE_KEY_MATERIAL -u APP_TOKEN PATH="$AGENT_PATH" "$OPENCODE_BIN" run \
              --auto \
              --agent plan \
              --model "$GITKEEPR_REVIEW_MODEL" \
              --variant "$GITKEEPR_REVIEW_VARIANT" \
              --format json \
              "$review_prompt" > "$review_events"; then
              fail "Review agent failed during cycle $cycle."
            fi
            assert_agent_git_boundary "$current_head" "Review"

            if ! verdict="$(REVIEW_EVENTS="$review_events" REVIEW_FILE="$review_file" HEAD_SHA="$current_head" python3 - <<'PY'
          import json
          import os
          import pathlib
          import re

          texts = []
          for raw in pathlib.Path(os.environ["REVIEW_EVENTS"]).read_text().splitlines():
              try:
                  event = json.loads(raw)
              except json.JSONDecodeError:
                  continue
              if event.get("type") == "text":
                  text = (event.get("part") or {}).get("text", "").strip()
                  if text:
                      texts.append(text)

          if not texts:
              raise SystemExit("No text response found in OpenCode Review JSON stream")

          review = texts[-1].strip()
          head = os.environ["HEAD_SHA"]
          pattern = re.compile(
              rf"<!-- gitkeepr-system-review:v1 head={re.escape(head)} verdict=(pass|continue) -->$"
          )
          match = pattern.search(review)
          if not match:
              raise SystemExit("Final Review is missing a valid marker for the current HEAD")
          if review.count("<!-- gitkeepr-system-review:v1") != 1:
              raise SystemExit("Final Review must contain exactly one GitKeepr review marker")

          pathlib.Path(os.environ["REVIEW_FILE"]).write_text(review + "\n")
          print(match.group(1))
          PY
            )"; then
              fail "Review agent returned an invalid or unusable verdict during cycle $cycle."
            fi

            git diff --exit-code || fail "Review agent modified tracked repository files during cycle $cycle."
            git diff --cached --exit-code || fail "Review agent modified the index during cycle $cycle."
            [[ -z "$(git ls-files --others --exclude-standard)" ]] ||
              fail "Review agent created untracked repository files during cycle $cycle."
            ensure_remote_head "$current_head"

            if [[ "$verdict" == "pass" ]]; then
              printf 'result=ready\n' >> "$GITKEEPR_OUTPUT_PATH"
              printf 'result_head=%s\n' "$current_head" >> "$GITKEEPR_OUTPUT_PATH"
              echo "GitKeepr reached PASS at $current_head after $cycle cycle(s)."
              exit 0
            fi

            review_context="$review_file"
          done

          printf 'result=needs-supervisor\n' >> "$GITKEEPR_OUTPUT_PATH"
          printf 'result_head=%s\n' "$final_head" >> "$GITKEEPR_OUTPUT_PATH"
          echo "GitKeepr used its bounded cycle budget without reaching PASS; supervisor action is required."
          exit 0

      - name: Create final GitKeepr App token
        id: final-app-token
        if: steps.context.outputs.skip != 'true' && steps.context.outputs.duplicate != 'true' && steps.loop.outcome == 'success' && steps.loop.outputs.result != 'superseded'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.GITKEEPR_APP_CLIENT_ID }}
          private-key: ${{ secrets.app_private_key || secrets.GITKEEPR_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Publish result and finalize status
        if: steps.context.outputs.skip != 'true' && steps.context.outputs.duplicate != 'true' && steps.loop.outcome == 'success' && steps.loop.outputs.result != 'superseded' && steps.final-app-token.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          REVIEW_DIR: ${{ runner.temp }}/gitkeepr-loop-reviews
          TRIGGER_KEY: ${{ steps.context.outputs.trigger_key }}
          RESULT: ${{ steps.loop.outputs.result }}
          RESULT_HEAD: ${{ steps.loop.outputs.result_head }}
        with:
          github-token: ${{ steps.final-app-token.outputs.token }}
          script: |
            const fs = require('fs')
            const path = require('path')
            const prNumber = Number(process.env.PR_NUMBER)
            const result = String(process.env.RESULT || '')
            const resultHead = String(process.env.RESULT_HEAD || '')
            const targetByResult = {
              ready: 'gitkeepr:ready',
              'needs-supervisor': 'gitkeepr:needs-supervisor',
            }
            const target = targetByResult[result]
            if (!target || !resultHead) {
              core.setFailed(`Invalid GitKeepr logical result: ${result || '(missing)'}`)
              return
            }

            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: prNumber })
            if (pr.head.sha !== resultHead) {
              core.notice(`GitKeepr result for ${resultHead} was superseded by current PR HEAD ${pr.head.sha}; no PR state will be changed`)
              return
            }

            const statuses = [
              'gitkeepr:ready',
              'gitkeepr:needs-supervisor',
              'gitkeepr:building',
              'gitkeepr:reviewing',
              'gitkeepr:waiting-human',
              'gitkeepr:blocked',
            ]
            for (const label of statuses) {
              if (label === target) continue
              try {
                await github.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: prNumber,
                  name: label,
                })
              } catch (error) {
                if (error.status !== 404) throw error
              }
            }
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: prNumber,
              labels: [target],
            })

            const reviewDir = process.env.REVIEW_DIR
            const reviewFiles = fs.existsSync(reviewDir)
              ? fs.readdirSync(reviewDir).filter(name => name.endsWith('.md')).sort()
              : []
            const triggerMarker = `<!-- gitkeepr-trigger:v2 key=${process.env.TRIGGER_KEY || ''} -->`

            if (reviewFiles.length) {
              for (let index = 0; index < reviewFiles.length; index++) {
                let body = fs.readFileSync(path.join(reviewDir, reviewFiles[index]), 'utf8').trim()
                if (index === reviewFiles.length - 1) {
                  body = [body, triggerMarker].filter(Boolean).join('\n\n')
                }
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: prNumber,
                  body,
                })
              }
              return
            }

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: prNumber,
              body: [`GitKeepr finished with result: ${result}.`, triggerMarker].join('\n\n'),
            })
